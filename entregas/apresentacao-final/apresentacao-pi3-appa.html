5355},{lambda:.5,AP:.270919141833791,nDCG_grad:.659058657789382,red:.0708368510291885}],teste:[{consulta:"q02",antes:.260695250867448,depois:.254028584200781},{consulta:"q04",antes:.321799844365482,depois:.291496814062452}],top:[{id:"d4",texto:'O Santos foi eleito pela FIFA em 2000 o quinto maior clube de futebol do S\xE9culo XX , sendo o melhor clube das Am\xE9ricas na lista, e tamb\xE9m recebeu no ano de seu centen\xE1rio na c\xE2mara dos deputados em Bras\xEDlia pela FIFA o t\xEDtulo de "maior clube sul-americano do S\xE9culo XX". Al\xE9m de ser o clube brasileiro que mais enfrentou estrangeiros na hist\xF3ria, o Santos \xE9 tamb\xE9m o \xFAnico clube brasileiro a ser campe\xE3o estadual , nacional, continental e mundial no mesmo ano, em 1962. Outro feito \xFAnico do clube \xE9 ser o que mais marcou gols na hist\xF3ria do futebol mundial, tendo sido o primeiro a alcan\xE7ar a marca de doze mil gols.',assunto:"conquistas",lambda:1},{id:"d2",texto:"O Santos tornou-se no futebol um dos clubes mais bem-sucedidos do Brasil e reconhecidos mundialmente. Ficou famoso na d\xE9cada de 1960 pelos v\xE1rios t\xEDtulos internacionais e nacionais conquistados e por ter formado a carreira profissional de Pel\xE9 , considerado por muitos como o maior jogador da hist\xF3ria do esporte, e segundo a FIFA , o melhor jogador do s\xE9culo XX . Al\xE9m disso, o Rei tamb\xE9m tem o marco de maior artilheiro da hist\xF3ria do Santos e o segundo maior artilheiro da Sele\xE7\xE3o Brasileira . \xC0 frente de Pel\xE9, com mais de 70 gols pela Sele\xE7\xE3o em jogos oficiais, est\xE1 Neymar , outro jogador tamb\xE9m revelado pelo clube.",assunto:"Pel\xE9 e t\xEDtulos",lambda:1},{id:"d95",texto:"Conhecidas como as Sereias da Vila , a hist\xF3ria do futebol feminino come\xE7ou em 1997. Para formar sua primeira equipe, o Santos teve como parceira a Marvel Cons\xF3rcios, que mantinha uma equipe feminina de futebol de sal\xE3o. Houve tamb\xE9m a realiza\xE7\xE3o de peneiras, chefiada pelo \xEDdolo Manoel Maria , que tamb\xE9m foi o primeiro treinador da equipe feminina do clube.",assunto:"origem do futebol feminino",lambda:1},{id:"d97",texto:"De 2009 a 2012, o Santos foi considerado o time mais forte de futebol feminino do Brasil, jogadoras como Marta e Cristiane passaram pelo Santos e o clube foi a base da Sele\xE7\xE3o Brasileira de Futebol Feminino , chegando a ter onze atletas convocadas de uma s\xF3 vez.",assunto:"destaque no futebol feminino",lambda:1},{id:"d55",texto:'H\xE1 uma grande controv\xE9rsia quanto ao hino oficial do Santos Futebol Clube. Nas primeiras d\xE9cadas de exist\xEAncia, os santistas adotaram como hino do clube uma par\xF3dia de uma can\xE7\xE3o que soldados ingleses entoavam durante a Primeira Guerra Mundial . A situa\xE7\xE3o mudou quando Mangeri Neto e Mangeri Sobrinho resolveram homenagear o Santos, criando a marchinha "Le\xE3o do Mar" quando o clube foi campe\xE3o paulista de 1955.',assunto:"hist\xF3ria do hino",lambda:1},{id:"d4",texto:'O Santos foi eleito pela FIFA em 2000 o quinto maior clube de futebol do S\xE9culo XX , sendo o melhor clube das Am\xE9ricas na lista, e tamb\xE9m recebeu no ano de seu centen\xE1rio na c\xE2mara dos deputados em Bras\xEDlia pela FIFA o t\xEDtulo de "maior clube sul-americano do S\xE9culo XX". Al\xE9m de ser o clube brasileiro que mais enfrentou estrangeiros na hist\xF3ria, o Santos \xE9 tamb\xE9m o \xFAnico clube brasileiro a ser campe\xE3o estadual , nacional, continental e mundial no mesmo ano, em 1962. Outro feito \xFAnico do clube \xE9 ser o que mais marcou gols na hist\xF3ria do futebol mundial, tendo sido o primeiro a alcan\xE7ar a marca de doze mil gols.',assunto:"conquistas",lambda:.9},{id:"d95",texto:"Conhecidas como as Sereias da Vila , a hist\xF3ria do futebol feminino come\xE7ou em 1997. Para formar sua primeira equipe, o Santos teve como parceira a Marvel Cons\xF3rcios, que mantinha uma equipe feminina de futebol de sal\xE3o. Houve tamb\xE9m a realiza\xE7\xE3o de peneiras, chefiad
